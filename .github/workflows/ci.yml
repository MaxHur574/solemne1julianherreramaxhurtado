name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    
name: Checkout repo
    uses: actions/checkout@v4,

    
name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.13",

    
name: Install uv
    run: pip install uv,

    
name: Install dependencies
    run: uv sync,

    
name: Run tests
    run: uv run pytest -v

