[project]
name = "fastapi-chile-time"
version = "0.1.0"
description = "API en FastAPI que entrega hora UTC y hora oficial de Chile usando NTP."
authors = [
    { name = "Maximiliano", email = "mhurtadop@correo.uss.cl" }
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.135.3",
    "uvicorn==0.43.0",
    "ntplib==0.4.0",
    "tzdata==2026.1",
    "httpx==0.28.1",
    "pytest==9.0.2",
]


[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["."]



